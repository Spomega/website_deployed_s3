<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">Secure static website Terraform architecture</title>
  <desc id="description">A visitor connects through CloudFront and Origin Access Control to a private S3 website bucket. Terraform and a separate private state bucket manage the infrastructure.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cloudfront" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" x2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="url(#background)"/>
  <rect x="48" y="42" width="1504" height="876" rx="30" fill="#ffffff" filter="url(#shadow)"/>

  <text x="100" y="120" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0f172a">Secure Static Website Architecture</text>
  <text x="100" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">Terraform-managed Amazon S3, CloudFront, Origin Access Control, and remote state</text>

  <rect x="100" y="205" width="1400" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="130" y="250" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#334155">Website request path</text>

  <g filter="url(#shadow)">
    <rect x="145" y="330" width="230" height="160" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="260" cy="374" r="28" fill="#e0f2fe"/>
    <circle cx="260" cy="364" r="10" fill="#0f766e"/>
    <path d="M235 416c4-23 16-34 25-34s21 11 25 34" fill="#0f766e"/>
    <text x="260" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Website Visitor</text>
    <text x="260" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Browser</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="515" y="300" width="290" height="220" rx="24" fill="url(#cloudfront)"/>
    <path d="M603 381c0-26 21-47 47-47 17 0 32 9 40 22 7-5 16-8 26-8 23 0 41 18 41 41 0 2 0 4-1 6 17 3 30 18 30 36 0 21-17 39-39 39H608c-24 0-44-19-44-44 0-23 17-41 39-44z" transform="translate(165 90) scale(.75)" fill="#ffffff" opacity=".95"/>
    <rect x="530" y="448" width="260" height="62" rx="14" fill="#4338ca"/>
    <text x="660" y="476" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Amazon CloudFront</text>
    <text x="660" y="503" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dbeafe">HTTPS delivery and caching</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="955" y="300" width="230" height="220" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <path d="M1014 393c0-20 16-36 36-36 13 0 24 7 30 18 6-4 12-6 20-6 17 0 30 13 30 30 0 2 0 3-1 5 12 2 21 12 21 25 0 15-12 27-27 27h-76c-17 0-31-14-31-31 0-17 12-30 28-32z" fill="#f97316"/>
    <path d="M1043 409l11 11 24-27" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="970" y="452" width="200" height="60" rx="14" fill="#fff7ed"/>
    <text x="1070" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a">CloudFront OAC</text>
    <text x="1070" y="503" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7c2d12">SigV4-signed access</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1260" y="300" width="195" height="240" rx="24" fill="url(#s3)"/>
    <path d="M1306 368h102l-13 23h-76z" fill="#d1fae5"/>
    <path d="M1306 368v90l13 23h76l13-23v-90" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M1326 412h60M1326 432h60" stroke="#d1fae5" stroke-width="4" stroke-linecap="round"/>
    <rect x="1270" y="481" width="175" height="55" rx="14" fill="#047857"/>
    <text x="1358" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Private S3</text>
    <text x="1358" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d1fae5">Kojo site files</text>
  </g>

  <path d="M377 410H495" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="437" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">HTTPS request</text>
  <path d="M807 410H935" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="870" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Origin request</text>
  <path d="M1187 410H1240" fill="none" stroke="#059669" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="1214" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#047857">Allowed</text>

  <rect x="100" y="635" width="1400" height="230" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="130" y="680" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#334155">Infrastructure and state management path</text>

  <g filter="url(#shadow)">
    <rect x="180" y="720" width="270" height="105" rx="20" fill="#334155"/>
    <text x="315" y="765" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff">DevOps Engineer</text>
    <text x="315" y="794" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#cbd5e1">make plan / make apply</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="625" y="710" width="320" height="125" rx="20" fill="#7c3aed"/>
    <text x="785" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Terraform</text>
    <text x="785" y="786" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ede9fe">Modules + dev/staging/prod</text>
    <text x="785" y="810" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ede9fe">remote backend with locking</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1120" y="710" width="290" height="125" rx="20" fill="#0f766e"/>
    <text x="1265" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">S3 State Bucket</text>
    <text x="1265" y="786" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ccfbf1">Encrypted, versioned, private</text>
    <text x="1265" y="810" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ccfbf1">State files and lock files</text>
  </g>

  <path d="M452 772H605" fill="none" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>
  <path d="M947 772H1100" fill="none" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>
  <text x="1023" y="753" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Read state + lock safely</text>
</svg>
